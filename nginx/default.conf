server {
    listen 80;
    server_name smart-rabbit.adalacreations.com www.smart-rabbit.adalacreations.com;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name smart-rabbit.adalacreations.com www.smart-rabbit.adalacreations.com;

    ssl_certificate /etc/letsencrypt/live/smart-rabbit.adalacreations.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smart-rabbit.adalacreations.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
location / {
    proxy_pass http://127.0.0.1:3005;   # <-- use host and published port
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}

}
