version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: smart_rabbit_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  app:
    build: .
    container_name: smart-rabbit
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "3005:3005"

volumes:
  postgres_data:
