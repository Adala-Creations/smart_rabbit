version: "3.8"
services:
  db:
    image: postgres:14
    container_name: smart-rabbit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rabbit_user
      POSTGRES_PASSWORD: "RabbitU$$3r"  # <- escape $
      POSTGRES_DB: smart_rabbit
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: smart-rabbit
    restart: unless-stopped
    ports:
      - "3005:3005"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  db-data:
