version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: smart-rabbit-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - smart-rabbit-db-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: smart-rabbit-app
    ports:
      - "3005:3005"
    depends_on:
      - db
    environment:
      NODE_ENV: production

volumes:
  smart-rabbit-db-data:
