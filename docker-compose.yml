version: "3.8"

services:
  db:
    image: postgres:14
    container_name: smart-rabbit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rabbit_user
      POSTGRES_PASSWORD: RabbitU%243r   # Note: $ is URL-encoded in DATABASE_URL
      POSTGRES_DB: smart_rabbit
    ports:
      - "5433:5432"   # Host port 5433 → Container port 5432
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: smart-rabbit
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3005:3005"
    depends_on:
      - db
    networks:
      - default

volumes:
  db-data:

networks:
  default:
    name: smart_rabbit_default
