version: "3.9"

services:
  db:
    image: postgres:14
    container_name: smart-rabbit-db
    ports:
      - "5433:5432"      # host:container
    environment:
      POSTGRES_USER: rabbit_user
      POSTGRES_PASSWORD: RabbitU$$3r
      POSTGRES_DB: smart_rabbit
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - smart_rabbit_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-rabbit-app
    depends_on:
      - db
    ports:
      - "3005:3005"   # host:container, matches Next.js PORT
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgresql://rabbit_user:RabbitU$3r@db:5432/smart_rabbit?schema=public
      NEXTAUTH_URL: https://smart-rabbit.adalacreations.com
      NEXTAUTH_SECRET: t6+S1cnv5usrWbv0nX2xV4rAlAuhdclC02HKHHG3nqo=
      REGISTRATION_KEY: RabbitFarm3r2025
    volumes:
      - ./smart_rabbit:/app:rw
    networks:
      - smart_rabbit_net
    restart: unless-stopped

networks:
  smart_rabbit_net:
    driver: bridge

volumes:
  db_data:
