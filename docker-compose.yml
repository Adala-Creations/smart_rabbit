version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: smart-rabbit-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - smart_rabbit_data:/var/lib/postgresql/data
    networks:
      - smart_rabbit_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-rabbit-app
    restart: always
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - smart_rabbit_net

  nginx:
    image: nginx:latest
    container_name: smart-rabbit-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - smart_rabbit_net

volumes:
  smart_rabbit_data:

networks:
  smart_rabbit_net:
    driver: bridge
