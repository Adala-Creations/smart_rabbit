version: "3.9"

services:
  db:
    image: postgres:14
    container_name: smart-rabbit-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5433:5432"        # Optional, remove if DB should be internal only
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-rabbit-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3005:3000"        # Map internal 3000 to external 3005
    depends_on:
      - db
    volumes:
      - ./:/app            # Optional: only needed if hot-reload / local dev
    networks:
      - smart_rabbit_default
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    user: "1000:1000"      # Match non-root UID/GID

networks:
  smart_rabbit_default:
    driver: bridge

volumes:
  db_data:
