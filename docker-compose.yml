version: "3.9"

services:
  db:
    image: postgres:14
    container_name: smart-rabbit-db
    ports:
      - "5433:5432"      # change host port if needed
  environment:
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - smart_rabbit_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-rabbit-app
    depends_on:
      - db
    ports:
      - "3005:3000"
    env_file:
      - .env
    volumes:
      - ./smart_rabbit:/app:rw
    networks:
      - smart_rabbit_net
    restart: unless-stopped

networks:
  smart_rabbit_net:
    driver: bridge

volumes:
  db_data:

