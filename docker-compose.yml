version: "3.8"

services:
  db:
    image: postgres:14
    container_name: smart-rabbit-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: smart-rabbit
    init: true
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3005:3005"
    depends_on:
      - db
    networks:
      - default
    cpus: "1.0"

volumes:
  db-data:

networks:
  default:
    name: smart_rabbit_default
